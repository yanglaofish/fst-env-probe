name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-test:
    name: 单元与宿主兼容测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 三平台矩阵：插件里所有平台分支与挂载识别逻辑都在这里被真实执行一次
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 运行单元测试
        working-directory: fst-env-probe
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          # 输出写进 job summary：公开仓库的 check-runs API 可匿名读取，
          # 失败时无需登录网页即可拿到完整详情。
          {
            echo "## 单元测试结果（${{ matrix.os }}）"
            echo ""
            echo "退出码：$status"
            echo ""
            echo '```text'
            tail -c 60000 test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: 从官方 npm 源安装宿主
        run: npm install --global @yanglaofish/fishtools@0.5.0 --registry=https://registry.npmjs.org

      - name: 真实宿主、共享服务与独立安装验证
        working-directory: fst-env-probe
        run: npm run test:integration

  latest-host:
    name: 官方最新宿主兼容性（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: 从官方 npm 源安装最新宿主
        run: npm install --global @yanglaofish/fishtools@latest --registry=https://registry.npmjs.org
      - name: 验证最新宿主兼容性
        working-directory: fst-env-probe
        run: npm run test:integration
